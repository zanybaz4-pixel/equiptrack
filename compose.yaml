name: equiptrack

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set migration owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random owner password}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set a different app password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/10-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  migrate:
    build: ./backend
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set owner connection URL}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    restart: "no"

  seed:
    build: ./backend
    profiles: [tools]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set owner connection URL}
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data]
    restart: "no"

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set runtime connection URL}
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost:8443}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["8000"]
    networks: [application, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  web:
    build: ./frontend
    expose: ["80"]
    networks: [presentation]
    restart: unless-stopped

  edge:
    image: nginx:1.28-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      api: { condition: service_healthy, restart: true }
      web: { condition: service_started, restart: true }
    networks: [presentation, application]
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  presentation:
  application:
    internal: true
  data:
    internal: true
