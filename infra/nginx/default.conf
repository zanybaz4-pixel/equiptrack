limit_req_zone $binary_remote_addr zone=equiptrack_login:1m rate=10r/m;
map "$request_method:$uri" $trace_request_creation {
    default 0;
    "POST:/api/requests" 1;
}
log_format equiptrack_trace 'request_id=$upstream_http_x_request_id method=$request_method route=$uri status=$status';

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/equiptrack.pem;
    ssl_certificate_key /etc/nginx/certs/equiptrack-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    client_max_body_size 1m;
    # Do not record search strings in access logs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/auth/login {
        limit_req zone=equiptrack_login burst=8 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limit;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location @login_limit {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Request-ID $request_id always;
        add_header Retry-After 6 always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many login attempts. Retry shortly.","request_id":"$request_id"}}';
    }

    location /api/ {
        include /etc/nginx/defense/*.conf;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
